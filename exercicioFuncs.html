<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Controle de Gastos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <main>
            <h1>Controle de Gastos</h1>
            <form class="form">
            <input type="number" name="valor" placeholder="Digite o valor do gasto"/> <!-- "placeholder" é a msg "fantasma" que aparece antes do usuário digitar -->
            <select name="categoria">
                <option>Alimentação</option>
                <option>Transporte</option>
                <option>Lazer</option>
                <option>Outros</option>
            </select>
            <button type="submit">Adicionar</button> 
            </form>
            <p id="Alimentação">Alimentação: R$ 0,00</p>
            <p id="Transporte">Transporte: R$ 0,00</p>
            <p id="Lazer">Lazer: R$ 0,00</p>
            <p id="Outros">Outros: R$ 0,00</p>
            <p id="Total">Total: R$ 0,00</p>
        </main>
    </div>

    <script type="module" src="exFuncsScript.js"></script> <!-- "module" permite o uso de Import -->
</body>
</html>
